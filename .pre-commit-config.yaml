repos:
  - repo: https://github.com/pocc/pre-commit-clang-format
    rev: v0.1.4
    hooks:
      - id: clang-format-hook
        args: [--style=file]
  - repo: https://github.com/pre-commit/mirrors-clang-tidy
    rev: v14
    hooks:
      - id: clang-tidy
        args: [-p, build]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
