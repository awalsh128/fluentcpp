name: CI

# The single set of pull request checks. release.yml calls this workflow so a
# release is held to exactly the same bar as a merge to master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefixed so the group never collides with a caller's when run via workflow_call.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version pinned in one place, shared with apply_format.yml and local runs.
      - name: Install clang-format
        run: pip install -r .github/clang-format-requirements.txt

      # Fix by running the Apply Format workflow, or locally with:
      #   git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' | xargs -0 clang-format -i
      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 -r clang-format --style=file --dry-run --Werror

  build-test:
    name: build-test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell.
        shell: bash
    strategy:
      # Let every platform report its own result instead of canceling on the first failure.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: macos-latest
            compiler: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            # No -G: CMake picks the newest Visual Studio on the runner image.
            cmake -B build -A x64 -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON
          fi

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

  clang-tidy:
    runs-on: ubuntu-latest
    # Advisory until the existing findings are cleaned up; see CLAUDE.md.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: git ls-files -z 'src/*.cpp' | xargs -0 -r clang-tidy -p build

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DBUILD_WEBSITE=ON

      - name: Build website
        run: cmake --build build --target website_api

      # release.yml deploys this artifact, so the published site is exactly what CI built.
      - name: Upload website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: build/website
          if-no-files-found: error
          retention-days: 7

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ -DBUILD_BENCHMARKS=ON

      # Build only: timings on shared runners are too noisy to gate on.
      - name: Build
        run: cmake --build build --parallel --target benchmarks benchmarks_baseline
