name: Docs

# Rebuilds the Doxygen website from the dispatched branch and deploys it to GitHub Pages, without
# cutting a release. Releases deploy the docs through release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DBUILD_WEBSITE=ON

      - name: Build website
        run: cmake --build build --target website_api

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build/website
