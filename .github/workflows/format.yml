name: Format Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  # Pinned so CI, apply_format.yml and local runs format identically. Install locally with:
  #   pip install clang-format==<version>
  CLANG_FORMAT_VERSION: "23.1.5"

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Install clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"

      # Fails when any C/C++ file differs from .clang-format. Fix by running the Apply Format
      # workflow, or locally with:
      #   git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' | xargs -0 clang-format -i
      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          if ! git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' | grep -qz .; then
            echo "No C/C++ source files found."
            exit 0
          fi
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 clang-format --style=file --dry-run --Werror
